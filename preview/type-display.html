<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'BebasNeue'; src: url('../fonts/BebasNeue-Regular.ttf'); }
  @font-face { font-family: 'JetBrainsMono'; src: url('../fonts/JetBrainsMono-VariableFont_wght.ttf'); font-style: normal; }
  @font-face { font-family: 'JetBrainsMono'; src: url('../fonts/JetBrainsMono-Italic-VariableFont_wght.ttf'); font-style: italic; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; padding: 24px 28px; display: flex; flex-direction: column; gap: 6px; }
  .display-hero { font-family: 'BebasNeue', sans-serif; font-size: 88px; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; color: #FFEE00; }
  .display-h1 { font-family: 'BebasNeue', sans-serif; font-size: 52px; line-height: 1.05; letter-spacing: 0.06em; text-transform: uppercase; }
  .display-h2 { font-family: 'BebasNeue', sans-serif; font-size: 36px; line-height: 1.1; letter-spacing: 0.05em; text-transform: uppercase; color: #9494C8; }
  .label { font-family: 'JetBrainsMono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #9494C8; margin-top: 4px; }
</style>
</head>
<body>
  <div class="label">Display / Hero</div>
  <div class="display-hero">Diego Furtado</div>
  <div class="label">H1 — Heading</div>
  <div class="display-h1">Analista de Dados</div>
  <div class="label">H2 — Section</div>
  <div class="display-h2">Design de Conteúdo</div>
</body>
</html>
