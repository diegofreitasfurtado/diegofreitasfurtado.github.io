<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'JetBrainsMono'; src: url('../fonts/JetBrainsMono-VariableFont_wght.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; padding: 24px 28px; font-family: 'JetBrainsMono', monospace; display: flex; gap: 32px; align-items: flex-start; }
  .group { display: flex; flex-direction: column; gap: 14px; }
  .head { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #FFEE00; margin-bottom: 2px; }
  .box { width: 90px; height: 52px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #9494C8; letter-spacing: 0.1em; }
  .label { font-size: 8px; color: #9494C8; letter-spacing: 0.1em; margin-top: 4px; text-transform: uppercase; }
  .r-item { display: flex; align-items: center; gap: 10px; }
  .r-box { width: 40px; height: 40px; background: #0C0D2A; border: 1px solid #9494C8; }
  .r-label { font-size: 9px; color: #9494C8; }
</style>
</head>
<body>
  <div class="group">
    <div class="head">Shadows</div>
    <div>
      <div class="box" style="box-shadow: 4px 4px 0px #FFEE00; border: 1px solid #333">sharp-yellow</div>
      <div class="label">--shadow-sharp</div>
    </div>
    <div>
      <div class="box" style="box-shadow: 4px 4px 0px #0C0D2A; background:#fff; color:#000; border:1px solid #333">sharp-dark</div>
      <div class="label">--shadow-dark</div>
    </div>
    <div>
      <div class="box" style="box-shadow: 4px 4px 0px #E0003D; border: 1px solid #333">sharp-red</div>
      <div class="label">--shadow-red</div>
    </div>
  </div>
  <div class="group">
    <div class="head">Borders</div>
    <div class="r-item"><div class="r-box" style="border: 1px solid #9494C8"></div><div class="r-label">1px lavender</div></div>
    <div class="r-item"><div class="r-box" style="border: 2px solid #FFEE00; background:#000"></div><div class="r-label">2px yellow</div></div>
    <div class="r-item"><div class="r-box" style="border: 1px solid #E0003D; background:#000"></div><div class="r-label">1px red</div></div>
    <div class="r-item"><div class="r-box" style="border: 1px solid #1B2585; background:#fff"></div><div class="r-label">1px blue (light)</div></div>
  </div>
  <div class="group">
    <div class="head">Radius</div>
    <div class="r-item"><div class="r-box" style="border-radius:0; background:#1B2585; border:none"></div><div class="r-label">0px — default</div></div>
    <div class="r-item"><div class="r-box" style="border-radius:2px; background:#1B2585; border:none"></div><div class="r-label">2px — sm</div></div>
    <div class="r-item"><div class="r-box" style="border-radius:4px; background:#1B2585; border:none"></div><div class="r-label">4px — md</div></div>
    <div class="r-item"><div class="r-box" style="border-radius:999px; background:#1B2585; border:none"></div><div class="r-label">pill — tags</div></div>
  </div>
</body>
</html>
