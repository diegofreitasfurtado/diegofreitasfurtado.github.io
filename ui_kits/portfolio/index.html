/* ══ GEOMETRIC COMPONENTS ════════════════════════════════ */
const ConcentricCircles = ({ color='#1B2585', size=120, rings=5 }) => {
  const cx=size/2,cy=size/2,maxR=size/2-4;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {Array.from({length:rings},(_,i)=><circle key={i} cx={cx} cy={cy} r={maxR*((rings-i)/rings)} fill="none" stroke={color} strokeWidth="1"/>)}
    <circle cx={cx} cy={cy} r={3} fill={color}/>
  </svg>;
};
const NestedTriangles = ({ color='#E0003D', size=120, count=5 }) => {
  const tris=Array.from({length:count},(_,i)=>{
    const scale=(count-i)/count,h=(size-12)*scale,cx=size/2;
    const base=size-6-(size-12)*(1-scale)/2-(size-12)*(1-scale);
    return `${cx-h/2},${base} ${cx+h/2},${base} ${cx},${base-h}`;
  });
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {tris.map((pts,i)=><polygon key={i} points={pts} fill="none" stroke={color} strokeWidth="1"/>)}
  </svg>;
};
const OverlappingCircles = ({ color='#9494C8', size=120 }) => {
  const r=size*0.28,cx=size/2,cy=size/2,o=r*0.6;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    <circle cx={cx-o/2} cy={cy-o*0.4} r={r} fill="none" stroke={color} strokeWidth="1"/>
    <circle cx={cx+o/2} cy={cy-o*0.4} r={r} fill="none" stroke={color} strokeWidth="1"/>
    <circle cx={cx} cy={cy+o*0.5} r={r} fill="none" stroke={color} strokeWidth="1"/>
  </svg>;
};
const RotatingSquares = ({ color='#FFEE00', size=120, count=5 }) => {
  const cx=size/2,cy=size/2;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {Array.from({length:count},(_,i)=>{const s=(size-8)*((count-i)/count);return(
      <rect key={i} x={cx-s/2} y={cy-s/2} width={s} height={s} fill="none" stroke={color} strokeWidth="1" transform={`rotate(${i*8} ${cx} ${cy})`}/>
    );})}
  </svg>;
};
const LineGrid = ({ color='#1A1A1A', size=120, lines=6, opacity=0.12 }) => (
  <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {Array.from({length:lines},(_,i)=>[
      <line key={`h${i}`} x1="0" y1={size/(lines-1)*i} x2={size} y2={size/(lines-1)*i} stroke={color} strokeWidth="1" opacity={opacity}/>,
      <line key={`v${i}`} x1={size/(lines-1)*i} y1="0" x2={size/(lines-1)*i} y2={size} stroke={color} strokeWidth="1" opacity={opacity}/>
    ])}
  </svg>
);
const Brackets = ({ color='#1A1A1A', size=12, opacity=0.4 }) => <>
  <div style={{position:'absolute',top:6,left:6,width:size,height:size,borderTop:`1px solid ${color}`,borderLeft:`1px solid ${color}`,opacity,pointerEvents:'none'}}/>
  <div style={{position:'absolute',top:6,right:6,width:size,height:size,borderTop:`1px solid ${color}`,borderRight:`1px solid ${color}`,opacity,pointerEvents:'none'}}/>
  <div style={{position:'absolute',bottom:6,left:6,width:size,height:size,borderBottom:`1px solid ${color}`,borderLeft:`1px solid ${color}`,opacity,pointerEvents:'none'}}/>

</>;

const ProjetoCard = ({ project, category, onClick, isSelected }) => {
  const [hov,setHov]=useState(false);
  const accent=la(category);
  // State hierarchy: selected > hover > normal
  const bgColor = isSelected ? category.color : hov ? category.colorDark : 'var(--white)';
  const textColor = isSelected
    ? (category.color==='#FFEE00' ? category.colorDark : '#fff')
    : hov ? '#fff' : 'var(--ink)';
  const subColor = isSelected
    ? (category.color==='#FFEE00' ? `${category.colorDark}cc` : 'rgba(255,255,255,0.6)')
    : hov ? 'rgba(255,255,255,0.5)' : 'rgba(26,26,26,0.48)';
  const tagAccent = isSelected ? (category.color==='#FFEE00' ? category.colorDark : '#fff') : hov ? category.color : accent;

  return (
    <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:bgColor,border:`1px solid ${isSelected?'transparent':'rgba(26,26,26,0.09)'}`,borderTop:`3px solid ${isSelected?(category.color==='#FFEE00'?category.colorDark:category.color):accent}`,padding:24,cursor:'pointer',position:'relative',overflow:'hidden',transition:'background 160ms,border-color 160ms',display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{flex:1}}>
          <div style={{fontFamily:'var(--M)',fontSize:8,fontWeight:700,letterSpacing:'0.22em',textTransform:'uppercase',color:tagAccent,marginBottom:10}}>{category.label}</div>
          <div style={{fontFamily:'var(--D)',fontSize:22,letterSpacing:'0.04em',textTransform:'uppercase',color:textColor,lineHeight:1.05,marginBottom:5}}>{project.title}</div>
          <div style={{fontFamily:'var(--M)',fontSize:10,fontStyle:'italic',color:subColor}}>{project.subtitle}</div>
        </div>
        <div style={{opacity:0.3,flexShrink:0,marginLeft:12}}>
          {project.category==='powerbi'&&<ConcentricCircles color={tagAccent} size={46} rings={4}/>}
          {project.category==='tableau'&&<RotatingSquares color={tagAccent} size={46} count={4}/>}
          {project.category==='python'&&<NestedTriangles color={tagAccent} size={46} count={4}/>}
          {project.category==='experimentos'&&<OverlappingCircles color={tagAccent} size={46}/>}
          {project.category==='pesquisa'&&<ConcentricCircles color={tagAccent} size={46} rings={4}/>}
        </div>
      </div>
      <div style={{fontFamily:'var(--M)',fontSize:10,lineHeight:1.75,color:subColor,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>
        {project.desc.split('\n')[0]}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:10,marginTop:'auto',borderTop:`1px solid ${isSelected?'rgba(0,0,0,0.1)':hov?'rgba(255,255,255,0.08)':'rgba(26,26,26,0.07)'}`}}>
        <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
          {(project.tools||[]).slice(0,3).map(t=>(
            <span key={t} style={{fontFamily:'var(--M)',fontSize:8,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',background:`${tagAccent}20`,color:tagAccent,border:`1px solid ${tagAccent}40`,padding:'3px 7px'}}>{t}</span>
          ))}
        </div>
        <span style={{fontFamily:'var(--M)',fontSize:8,color:subColor,letterSpacing:'0.1em',textTransform:'uppercase',flexShrink:0}}>{project.year}</span>
      </div>
    </div>
  );
};

            const resolvedItems=itemsKey?(T[lang][itemsKey]||T.pt[itemsKey]||[]):items;
            return (
              <div key={akey} style={{marginBottom:18}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
                  <div style={{width:16,height:1,background:accent}}/>
                  <div style={{fontFamily:'var(--D)',fontSize:15,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--ink)'}}>{t(akey)}</div>
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                  {resolvedItems.map(item=><span key={item} style={{fontFamily:'var(--M)',fontSize:9,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',background:'var(--white)',color:accent,border:`1px solid ${accent}33`,padding:'3px 8px'}}>{item}</span>)}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

/* ══ APP ══════════════════════════════════════════════════ */
const App = () => {
  const [page,setPage]=useState('home');
  const [selectedId,setSelectedId]=useState(null);
  const [lang,setLang]=useState('pt');
  const ref=useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.scrollTop=0; },[page]);
  const handleProjectClick=(id)=>{ setSelectedId(id); setPage('projeto'); };

  const renderPage=()=>{
    if(page==='home') return <HomePage setPage={setPage} lang={lang}/>;
    if(page==='projetos') return <ProjetosPage onProjectClick={handleProjectClick} lang={lang}/>;
    if(page==='sobre') return <SobrePage lang={lang}/>;
    if(page==='projeto'){
      const ProjPage=window.ProjectPage;
      return ProjPage?<ProjPage projectId={selectedId} onBack={()=>setPage('projetos')}/>:<div style={{padding:80,fontFamily:'var(--M)'}}>Carregando…</div>;
    }
    return <HomePage setPage={setPage} lang={lang}/>;
  };

  return (
    <div id="scroll-root" style={{height:'100vh',overflowY:'auto'}} ref={ref}>
      <Header page={page} setPage={setPage} lang={lang} setLang={setLang}/>
      <main style={{paddingTop:60}}>{renderPage()}</main>
      <Footer lang={lang}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
