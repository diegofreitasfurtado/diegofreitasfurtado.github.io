const getPortfolioData = () => window.PROJECTS_DATA || {};
const getAboutContent = (lang) => {
  const data = getPortfolioData();
  const about = data.about || {};
  return about[lang] || about.pt || {
    quote: '',
    subtitle: '',
    bioName: '',
    bio: [],
    experience: [],
    education: [],
    skills: [],
    footerCopy: ''

};

const hydrateTranslationsFromData = () => {
  ['pt', 'en'].forEach((lang) => {
    const about = getAboutContent(lang);
    if (!T[lang]) return;

    T[lang].about_quote = about.quote || T[lang].about_quote;
    T[lang].about_subtitle = about.subtitle || T[lang].about_subtitle;
    T[lang].bio_name = about.bioName || T[lang].bio_name;
    T[lang].footer_copy = about.footerCopy || T[lang].footer_copy;

    (about.bio || []).forEach((paragraph, index) => {
      T[lang][`bio_p${index + 1}`] = paragraph;
    });

    (about.experience || []).forEach((experience, index) => {
      const expIndex = index + 1;
      T[lang][`exp${expIndex}_role`] = experience.role || T[lang][`exp${expIndex}_role`];
      T[lang][`exp${expIndex}_co`] = experience.company || T[lang][`exp${expIndex}_co`];
      T[lang][`exp${expIndex}_period`] = experience.period || T[lang][`exp${expIndex}_period`];
      T[lang][`exp${expIndex}_loc`] = experience.location || T[lang][`exp${expIndex}_loc`];
      T[lang][`exp${expIndex}_b`] = experience.bullets || T[lang][`exp${expIndex}_b`];
    });

    (about.education || []).forEach((education, index) => {
      const eduIndex = index + 1;
      T[lang][`edu${eduIndex}`] = education.title || T[lang][`edu${eduIndex}`];
      T[lang][`edu${eduIndex}_note`] = education.note || T[lang][`edu${eduIndex}_note`];
    });

    (about.skills || []).forEach((skill, index) => {
      const skillIndex = index + 1;
      T[lang][`sk${skillIndex}`] = skill.title || T[lang][`sk${skillIndex}`];
      if (skillIndex >= 3) {
        T[lang][`sk${skillIndex}_items`] = skill.items || T[lang][`sk${skillIndex}_items`];
      }
    });
  });
};

/* ══ GEOMETRIC COMPONENTS ════════════════════════════════ */
const ConcentricCircles = ({ color='#1B2585', size=120, rings=5 }) => {
  const cx=size/2,cy=size/2,maxR=size/2-4;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {Array.from({length:rings},(_,i)=><circle key={i} cx={cx} cy={cy} r={maxR*((rings-i)/rings)} fill="none" stroke={color} strokeWidth="1"/>)}
    <circle cx={cx} cy={cy} r={3} fill={color}/>
  </svg>;
};
const NestedTriangles = ({ color='#E0003D', size=120, count=5 }) => {
  const tris=Array.from({length:count},(_,i)=>{
    const scale=(count-i)/count,h=(size-12)*scale,cx=size/2;
    const base=size-6-(size-12)*(1-scale)/2-(size-12)*(1-scale);
    return `${cx-h/2},${base} ${cx+h/2},${base} ${cx},${base-h}`;
  });
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {tris.map((pts,i)=><polygon key={i} points={pts} fill="none" stroke={color} strokeWidth="1"/>)}
  </svg>;
};
const OverlappingCircles = ({ color='#9494C8', size=120 }) => {
  const r=size*0.28,cx=size/2,cy=size/2,o=r*0.6;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    <circle cx={cx-o/2} cy={cy-o*0.4} r={r} fill="none" stroke={color} strokeWidth="1"/>
    <circle cx={cx+o/2} cy={cy-o*0.4} r={r} fill="none" stroke={color} strokeWidth="1"/>
    <circle cx={cx} cy={cy+o*0.5} r={r} fill="none" stroke={color} strokeWidth="1"/>
  </svg>;
};
const RotatingSquares = ({ color='#FFEE00', size=120, count=5 }) => {
  const cx=size/2,cy=size/2;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {Array.from({length:count},(_,i)=>{const s=(size-8)*((count-i)/count);return(
      <rect key={i} x={cx-s/2} y={cy-s/2} width={s} height={s} fill="none" stroke={color} strokeWidth="1" transform={`rotate(${i*8} ${cx} ${cy})`}/>
    );})}
  </svg>;
};
const LineGrid = ({ color='#1A1A1A', size=120, lines=6, opacity=0.12 }) => (
  <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:'block'}}>
    {Array.from({length:lines},(_,i)=>[
      <line key={`h${i}`} x1="0" y1={size/(lines-1)*i} x2={size} y2={size/(lines-1)*i} stroke={color} strokeWidth="1" opacity={opacity}/>,
      <line key={`v${i}`} x1={size/(lines-1)*i} y1="0" x2={size/(lines-1)*i} y2={size} stroke={color} strokeWidth="1" opacity={opacity}/>
    ])}
  </svg>
);

/* ── Filter chip ────────────────────────────────────────── */
const FilterChip = ({ label, active, onClick, color, soloMode, fullWidth, size='md' }) => {
  const styleOff = soloMode
    ? { background: color, color:'var(--cream)', borderColor:'transparent' }
    : { background:'var(--cream)', color:'var(--ink)', borderColor:'var(--lav)' };
  const styleOn = soloMode
    ? { background: color, color:'var(--cream)', borderColor:'rgba(255,255,255,0.5)', fontWeight:800 }
    : { background:'var(--lavlt)', color:'var(--navy)', borderColor:'var(--lavlt)', fontWeight:700 };
  const s = active ? styleOn : styleOff;
  const sz = size==='lg'
    ? { fontSize:13, fontWeight:700, padding:'9px 14px' }
    : { fontSize:9,  fontWeight:600, padding:'4px 10px' };
  return (
    <button onClick={onClick}
      style={{fontFamily:'var(--M)',...sz,borderRadius:2,cursor:'pointer',border:`1px solid ${s.borderColor}`,background:s.background,color:s.color,...(s.fontWeight?{fontWeight:s.fontWeight}:{}),transition:'all 120ms',userSelect:'none',...(fullWidth?{display:'block',width:'100%',textAlign:'left'}:{whiteSpace:'nowrap'})}}>
      {label}
    </button>
  );
};

const ProjetosPage = ({ onProjectClick, lang }) => {
  const t=k=>T[lang][k]??T.pt[k]??k;
  const interests=getInterests();
  const techs=getTechnologies();
  const sols=getSolutionTypes();
  const allProjects=visibleProjects();

  const [selInt,setSelInt]=useState(()=>new Set());
  const [selTech,setSelTech]=useState(()=>new Set());
  const [selSol,setSelSol]=useState(()=>new Set());
  const [flashId,setFlashId]=useState(null);

  const toggle=(set,setter,key)=>{
    const next=new Set(set);
    if(next.has(key)) next.delete(key); else next.add(key);
    setter(next);
  };
  const clearAll=()=>{ setSelInt(new Set()); setSelTech(new Set()); setSelSol(new Set()); };

  // Cascade: tech/sol available = only those used by interest-matched projects
  const interestMatched = selInt.size>0 ? allProjects.filter(p=>selInt.has(p.interest)) : allProjects;
  const availableTechs = new Set(interestMatched.flatMap(p=>p.technologies||[]));
  const availableSols  = new Set(interestMatched.flatMap(p=>p.solutionType||[]));

  // Auto-clear tech/sol selections that disappear when interests change
  useEffect(()=>{
    if(selInt.size===0) return;
    const intF=allProjects.filter(p=>selInt.has(p.interest));
    const avT=new Set(intF.flatMap(p=>p.technologies||[]));
    const avS=new Set(intF.flatMap(p=>p.solutionType||[]));
    setSelTech(prev=>{ const n=new Set([...prev].filter(t=>avT.has(t))); return n.size===prev.size?prev:n; });
    setSelSol(prev=>{ const n=new Set([...prev].filter(s=>avS.has(s))); return n.size===prev.size?prev:n; });
  },[selInt]);

  // AND between groups, OR within group
  const matches=(p)=>{
    if(selInt.size>0 && !selInt.has(p.interest)) return false;
    if(selTech.size>0 && !(p.technologies||[]).some(x=>selTech.has(x))) return false;
    if(selSol.size>0 && !(p.solutionType||[]).some(x=>selSol.has(x))) return false;
    return true;
  };
  const filtered=allProjects.filter(matches);
  const total=allProjects.length;
  const hasFilters=selInt.size>0||selTech.size>0||selSol.size>0;

  const handleCardClick=(id)=>{
    setFlashId(id);
    setTimeout(()=>{ onProjectClick(id); setFlashId(null); }, 180);
  };

  // Sidebar accent follows single selected interest
  const singleInt = selInt.size===1 ? [...selInt][0] : null;
  const sidebarAccent = singleInt ? (interests[singleInt]?.color||'var(--navy)') : 'var(--navy)';

  return (
    <div>
      {/* Header */}
      <div style={{background:'var(--navy)',padding:'80px 48px 40px',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',right:48,bottom:-30,opacity:0.07}}><RotatingSquares color="var(--yellow)" size={260} count={7}/></div>
        <PanelLabel color="rgba(255,255,255,0.38)">{t('portfolio_tag')}</PanelLabel>
        <h1 style={{fontFamily:'var(--D)',fontSize:64,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--white)',position:'relative',zIndex:1}}>{t('projects_heading')}</h1>
      </div>

      {/* Two-column layout: grid + sidebar */}
      <div style={{background:'var(--cream)',display:'grid',gridTemplateColumns:'1fr 264px',alignItems:'start'}}>

        {/* LEFT: project grid */}
        <div style={{padding:'32px 48px 64px',borderRight:'1px solid rgba(26,26,26,0.07)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20,paddingBottom:12,borderBottom:'1px solid rgba(26,26,26,0.08)'}}>
            <span style={{fontFamily:'var(--M)',fontSize:10,fontWeight:700,letterSpacing:'0.2em',textTransform:'uppercase',color:'rgba(26,26,26,0.45)'}}>
              {(T[lang].filter_status||T.pt.filter_status)(filtered.length,total)}
            </span>
            {hasFilters && (
              <button onClick={clearAll} style={{fontFamily:'var(--M)',fontSize:9,fontWeight:700,letterSpacing:'0.18em',textTransform:'uppercase',padding:'4px 10px',background:'transparent',color:'var(--ink)',border:'1px solid rgba(26,26,26,0.2)',cursor:'pointer'}}>
                {t('filter_clear')}
              </button>
            )}
          </div>
          {filtered.length===0 ? (
            <div style={{padding:'64px 0',textAlign:'center',fontFamily:'var(--M)',fontSize:11,color:'rgba(26,26,26,0.32)',letterSpacing:'0.15em',textTransform:'uppercase',border:'1px dashed var(--lav)'}}>{t('no_projects')}</div>
          ) : (
            <div style={{display:'grid',gridTemplateColumns:filtered.length>1?'1fr 1fr':'1fr',gap:12}}>
              {filtered.map(p=>{
                const i=interests[p.interest]||{color:'var(--blue)',colorDark:'var(--navy)',colorSoft:'var(--lavlt)'};
                return <ProjetoCard key={p.id} project={p} interest={i} lang={lang} onClick={()=>handleCardClick(p.id)} isSelected={flashId===p.id}/>;
              })}
            </div>
          )}
        </div>

        {/* RIGHT: sticky filter sidebar */}
        <div style={{position:'sticky',top:60,alignSelf:'start',height:'calc(100vh - 60px)',overflowY:'auto',background:'var(--white)',padding:'24px 16px 32px'}}>

          {/* Sidebar header */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:18,paddingBottom:10,borderBottom:`2px solid ${sidebarAccent}`,transition:'border-color 300ms'}}>
            <span style={{fontFamily:'var(--M)',fontSize:9,fontWeight:700,letterSpacing:'0.25em',textTransform:'uppercase',color:sidebarAccent,transition:'color 300ms'}}>Filtros</span>
            {hasFilters && (
              <button onClick={clearAll} style={{fontFamily:'var(--M)',fontSize:8,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',background:'none',border:'none',color:'rgba(26,26,26,0.38)',cursor:'pointer',padding:0}}
                onMouseEnter={e=>e.target.style.color='var(--ink)'}
                onMouseLeave={e=>e.target.style.color='rgba(26,26,26,0.38)'}>
                {t('filter_clear')}
              </button>
            )}
          </div>

          {/* ── Nível 1: Áreas (chips grandes, label pesado) */}
          <div style={{marginBottom:20}}>
            <div style={{fontFamily:'var(--M)',fontSize:9,fontWeight:700,letterSpacing:'0.25em',textTransform:'uppercase',color:'var(--ink)',paddingBottom:6,borderBottom:'1px solid rgba(26,26,26,0.12)',marginBottom:12}}>{t('filter_interests')}</div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {Object.entries(interests).map(([key,i])=>(
                <FilterChip key={key} label={lang==='en'?(i.en||i.pt):(i.pt||i.en)}
                  active={selInt.has(key)} onClick={()=>toggle(selInt,setSelInt,key)}
                  color={i.color} soloMode={true} fullWidth size='lg'/>
              ))}
            </div>
          </div>

          {/* separador entre níveis */}
          {(availableTechs.size>0||availableSols.size>0) && (
            <div style={{height:1,background:'rgba(26,26,26,0.07)',margin:'8px 0 20px'}}/>
          )}

          {/* ── Nível 2: Tecnologias (chips pequenos, label leve) */}
          {availableTechs.size>0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontFamily:'var(--M)',fontSize:9,fontWeight:700,letterSpacing:'0.25em',textTransform:'uppercase',color:'var(--ink)',paddingBottom:6,borderBottom:'1px solid rgba(26,26,26,0.12)',marginBottom:12}}>{t('filter_techs')}</div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {techs.filter(tech=>availableTechs.has(tech)).map(tech=>(
                  <FilterChip key={tech} label={tech}

/* ── hash routing ──────────────────────────────────────── */
const parseHash = () => {
  const h = window.location.hash.replace(/^#\/?/,'');
  if (!h) return {page:'home',id:null};
  const [seg,...rest] = h.split('/');
  const id = rest.length ? decodeURIComponent(rest.join('/')) : null;
  if (seg==='projetos' && id) return {page:'projeto',id};
  if (seg==='projetos') return {page:'projetos',id:null};
  if (seg==='conteudo' && id) return {page:'conteudo-item',id};
  if (seg==='conteudo') return {page:'conteudo',id:null};
  if (seg==='sobre') return {page:'sobre',id:null};
  return {page:'home',id:null};
};
const toHash = (page,id) => {
  if (page==='projeto' && id) return `#/projetos/${encodeURIComponent(id)}`;
  if (page==='conteudo-item' && id) return `#/conteudo/${encodeURIComponent(id)}`;
  return {home:'#/',projetos:'#/projetos',conteudo:'#/conteudo',sobre:'#/sobre'}[page]||'#/';
};
const PAGE_TITLES = {
  home:'D/F',
  projetos:'Projetos — D/F',
  projeto:'Projetos — D/F',
  conteudo:'Conteúdo — D/F',
  'conteudo-item':'Conteúdo — D/F',
  sobre:'Quem Sou — D/F',
};

    history.pushState({page:newPage,id:rid}, '', toHash(newPage, rid));
    _setPage(newPage);
    if (id !== undefined) setSelectedId(id);
  };

  useEffect(() => {
    const onPop = () => { const {page:p,id} = parseHash(); _setPage(p); setSelectedId(id); };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  useEffect(() => { document.title = PAGE_TITLES[page] || 'Diego Furtado'; }, [page]);
  useEffect(() => { if(ref.current) ref.current.scrollTop=0; }, [page]);

  const handleProjectClick = (id) => navigate('projeto', id);
  const setPage = navigate;

  const renderPage = () => {
    if(page==='home') return <HomePage setPage={setPage} lang={lang}/>;
    if(page==='projetos') return <ProjetosPage onProjectClick={handleProjectClick} lang={lang}/>;
    if(page==='conteudo') return <ConteudoPage onContentClick={(id)=>navigate('conteudo-item',id)} lang={lang}/>;
    if(page==='sobre') return <SobrePage lang={lang}/>;
    if(page==='projeto'){
      const ProjPage=window.ProjectPage;
      return ProjPage?<ProjPage projectId={selectedId} onBack={()=>navigate('projetos')} lang={lang}/>:<div style={{padding:80,fontFamily:'var(--M)'}}>Carregando…</div>;
    }
    if(page==='conteudo-item'){
      const CP=window.ContentPage;
      return CP?<CP contentId={selectedId} onBack={()=>navigate('conteudo')} lang={lang}/>:<div style={{padding:80,fontFamily:'var(--M)'}}>Carregando…</div>;
    }
    return <HomePage setPage={setPage} lang={lang}/>;
  };

  return (
    <div id="scroll-root" style={{height:'100vh',overflowY:'auto'}} ref={ref}>
      <Header page={page} setPage={setPage} lang={lang} setLang={setLang}/>
      <main style={{paddingTop:60}}>{renderPage()}</main>
      <Footer lang={lang}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
